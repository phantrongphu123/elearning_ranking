<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiến Cung - Hoàng Cung Học Đường (Tiếng Trung)</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 2.75rem 2.25rem;
            text-align: center;
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08), 0 0 25px rgba(245, 158, 11, 0.12);
            border-radius: var(--radius-lg);
            position: relative;
        }

        .login-logo {
            font-size: 3.5rem;
            margin-bottom: 0.85rem;
            filter: drop-shadow(0 4px 12px rgba(245, 158, 11, 0.35));
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 2px 8px rgba(245, 158, 11, 0.25)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 6px 18px rgba(245, 158, 11, 0.45)); }
        }

        .login-card h1 {
            font-size: 1.85rem;
            margin-bottom: 0.35rem;
            background: linear-gradient(135deg, #0F172A 20%, #D97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1.85rem;
            letter-spacing: 0.3px;
        }

        .login-subtitle span {
            color: var(--gold-light);
            font-weight: 600;
        }

        .error-message {
            color: #DC2626;
            background: #FEF2F2;
            border: 1px solid #FECACA;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            display: none;
            font-size: 0.88rem;
            text-align: left;
            font-weight: 500;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.15rem;
            padding: 4px;
        }

        .demo-accounts {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .demo-title {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.85rem;
            font-weight: 600;
        }

        .demo-badges {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .demo-btn {
            background: #F8FAFC;
            border: 1px solid #CBD5E1;
            color: #334155;
            padding: 0.45rem 0.85rem;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .demo-btn:hover {
            background: #FFFBEB;
            border-color: #FCD34D;
            color: #92400E;
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(245, 158, 11, 0.15);
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="glass-panel login-card animate-fade-in">
            <div class="login-logo-badge">LC</div>
            <h1>Hoàng Cung Học Đường</h1>
            <p class="login-subtitle">Học Viện Hán Ngữ Triều Đình · <span class="hanzi">皇宫学堂</span></p>

            <div id="errorMsg" class="error-message"></div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" placeholder="Nhập tên đăng nhập..." required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <div class="password-container">
                        <input type="password" id="password" placeholder="Nhập mật khẩu..." required autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Ẩn/Hiện mật khẩu">
                            <span id="togglePassIcon" style="font-size: 0.82rem; font-weight: 600; color: var(--gold-light);">Hiện</span>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem; margin-top: 1.25rem;">
                    <span>Đăng Nhập</span>
                </button>
            </form>

            <div class="demo-accounts">
                <div class="demo-title">Đăng Nhập Nhanh (Thử Nghiệm)</div>
                <div class="demo-badges">
                    <button class="demo-btn" onclick="quickLogin('student01', 'student123')">
                        Học Sinh
                    </button>
                    <button class="demo-btn" onclick="quickLogin('teacher01', 'teacher123')">
                        Giảng Viên
                    </button>
                    <button class="demo-btn" onclick="quickLogin('admin', 'admin123')">
                        Quản Trị Viên
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
