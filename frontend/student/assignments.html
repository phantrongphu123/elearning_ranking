<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tấu Chương (Bài Tập) - Học Sinh</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .assignment-card {
            background: rgba(0,0,0,0.2);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            border-left: 4px solid var(--primary-color);
            transition: transform 0.2s;
        }
        .assignment-card:hover {
            transform: translateX(5px);
            background: rgba(212, 175, 55, 0.05);
        }
        .meta-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0.5rem 0 1rem 0;
            display: flex;
            gap: 1rem;
        }
        .badge {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge-pending { background: rgba(255,193,7,0.2); color: #ffc107; }
        .badge-submitted { background: rgba(40,167,69,0.2); color: #28a745; }
        
        /* Modal for Answering */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: var(--bg-dark);
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }
        .question-block {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .options-grid {
            display: grid;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .option-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .option-label:hover {
            background: rgba(212, 175, 55, 0.1);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div style="font-size: 2.5rem; margin-bottom: 1rem;">🏯</div>
                <h2 style="font-size: 1.2rem;">Hoàng Cung<br>Học Đường</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">Tổng Quan</a>
                <a href="assignments.html" class="nav-item active">Tấu Chương (Bài Tập)</a>
                <a href="leaderboard.html" class="nav-item">Bảng Vàng (BXH)</a>
            </nav>
            <div style="padding: 1.5rem; text-align: center;">
                <button onclick="logout()" class="btn btn-secondary" style="width: 100%;">Xuất Cung</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div>
                    <h1 style="font-size: 1.8rem;">Tấu Chương Chờ Duyệt</h1>
                </div>
            </header>

            <div class="animate-fade-in glass-panel">
                <div id="assignmentsList">
                    <p class="text-center">Đang tải danh sách bài tập...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Assignment Modal -->
    <div id="assignmentModal" class="modal">
        <div class="modal-content">
            <div class="d-flex justify-between align-center mb-2">
                <h2 id="modalTitle">Làm Bài</h2>
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Đóng</button>
            </div>
            <div id="modalDescription" class="mb-2 text-muted"></div>
            
            <form id="submissionForm">
                <div id="questionsContainer"></div>
                <div class="mt-2 text-center" id="submitArea">
                    <button type="submit" class="btn btn-primary">Dâng Trình (Nộp Bài)</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="assignments.js"></script>
</body>
</html>
